    triggers: ["fabian", "güstrow", "gina h", "landgericht rostock"]
    keywords: ["fall fabian", "fall fabian aktuell", "prozess fabian", "mordprozess fabian", "gina h prozess", "fabian güstrow", "landgericht rostock", "true crime deutschland"]
