# Most-searched keywords (owner list from YouTube/vidIQ, 14 Nov 2026) – used by
#  • seo.py  : matching cluster keywords are added to the YouTube tags automatically
#  • feeds.py: stories that match a TRENDING keyword get a ranking boost (only while not expired)
#  • desks   : EDITOR_GUIDE rule 20 – put the searched phrase into title / hook / first sentence
# Rules: only keywords that fit the story (no stuffing). Never other channels' brand names
# (tagesschau, ZDF, BILD, WELT …) – YouTube treats that as misleading metadata.
# Update this file whenever the owner sends a new list.

updated: "2026-11-14"

# always useful for a German news Short (added as tags, max 4)
evergreen: ["nachrichten", "nachrichten heute", "aktuelle nachrichten", "deutschland", "politik", "news", "aktuell", "kurznachrichten"]

# topic clusters: if ANY trigger appears in the plan text → `generic` terms are always added as tags,
# `keywords` only when one of their words really occurs in the story (no names that are not in the video)
