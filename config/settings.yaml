# ============================================================
#  EILBLICK — DACH News Shorts  ·  Hauptkonfiguration
#  Everything public-facing is 100 % Hochdeutsch (de-DE).
# ============================================================

channel:
  name: "Eilblick"
  slogan: "Kompakt. Direkt. Auf den Punkt."
  website: "https://eilblick.de"
  facebook_url: "https://facebook.com/eilblick.de"
  language: "de"
  timezone: "Europe/Berlin"

# ---------- Publishing slots (Berlin local time) ----------
# Each run starts ~80 min before the slot, builds the Short, and uploads it
# as *scheduled* so it goes live exactly on time (GitHub cron delays don't matter).
slots:
  - id: morgen
    time: "07:00"
    label: "am Morgen"
    focus: "Wichtigste Nachrichten der Nacht und des Morgens: internationale Eilmeldungen der Nacht und die größte politische Schlagzeile in Deutschland."
    pillars: [POLITIK, WELT, WIRTSCHAFT, TECHNOLOGIE]
    notify_subscribers: true
  - id: mittag
    time: "12:00"
    label: "am Mittag"
    focus: "Wirtschaft und Finanzen zuerst: DAX, Inflation, EZB, Energiepreise, Autoindustrie (VW, BMW, Mercedes), Technologie."
    pillars: [WIRTSCHAFT, TECHNOLOGIE, POLITIK, WELT]
    notify_subscribers: true
  - id: abend
    time: "16:30"
    label: "am Abend"
    focus: "Innenpolitik (Bundestag, Bundesregierung, neue Gesetze), Energie, Alltag der Menschen in Deutschland, Österreich und der Schweiz."
    pillars: [POLITIK, WIRTSCHAFT, WELT, TECHNOLOGIE]
    notify_subscribers: true
  - id: nacht
    time: "20:45"
    label: "am späten Abend"
    focus: "Geopolitik, europäische Sicherheit, NATO, EU, Welthandel und Zölle – mit Bezug zu Deutschland."
    pillars: [WELT, POLITIK, WIRTSCHAFT, TECHNOLOGIE]
    notify_subscribers: false   # YouTube sends max ~3 notifications/day → slot 4 stays silent

  # ---- FOKUS format (owner, 6 Nov 2026): 1 video = 1 real story, 30–35 s, shock hook in the
  #      first second, no intro/outro, ends straight into a loop. Prime-time slots.
  - id: fokus-geld
    format: single
    time: "08:30"
    label: "Fokus Geld"
    focus: "Der eine Wirtschafts- oder Geld-Aufreger des Tages mit direkter Wirkung auf den Geldbeutel der Menschen in Deutschland, Österreich oder der Schweiz (Preise, Heizkosten, Steuern, Löhne, Rente, Mieten, Inflation, Jobs)."
    notify_subscribers: false
  - id: fokus-politik
    format: single
    time: "18:30"
    label: "Fokus Politik"
    focus: "Die eine große politische oder sicherheitspolitische Enthüllung bzw. Eilmeldung des Tages aus Berlin, Wien, Bern oder Brüssel (Regierung, Kanzleramt, Hackerangriffe, Spionage, große Entscheidungen, Skandale)."
    notify_subscribers: false
  - id: fokus-top
    format: single
    time: "22:00"
    label: "Fokus des Tages"
    focus: "Die meistdiskutierte, überraschendste Meldung des Tages im DACH-Raum (jedes Ressort außer Sport-Ergebnissen und Promi-Klatsch), die für die Menschen hier spürbare Folgen hat."
    notify_subscribers: false

build_window_minutes:
  before: 95    # a run may start up to 95 min before the slot …
  after: 45     # … or up to 45 min after it (then it publishes immediately)

# ---------- Editorial ----------
editorial:
  stories_per_short: 4          # 4 headlines per Short (allowed 4–5)
  max_stories_per_short: 5
  min_regional_stories: 3       # at least 3 of 4 from Germany / Austria / Switzerland / Europe
  min_sources_for_story: 2      # verification rule: ≥2 independent outlets must report it
  max_story_age_hours: 14
  dedupe_days: 2                # never repeat a story already used in the last 2 days
  words_per_story: [17, 24]     # spoken words per headline block
  max_total_words: 100          # ≈ 40–45 s incl. intro, transitions and end card
  single_words: [62, 84]        # FOKUS: whole voice-over (hook + beats + loop line) ≈ 30–35 s
  single_hard_max_seconds: 38
  target_seconds: 42
  hard_max_seconds: 50          # never longer than 50 s (auto-trims if needed)
  # The editorial desk is Claude itself (scheduled task). Only if that run could not happen
  # (e.g. usage limit) the GitHub fallback writes the edition via the Anthropic API key secret:
  api_model: "claude-sonnet-5-5"
  fallback_wait_minutes: 10

# ---------- Voice (ElevenLabs) ----------
voice:
  voice_id: "DEZHhPbmb8LVZmWufkCh"
  model_id: "eleven_multilingual_v2"
  output_format: "mp3_44100_128"
  settings:
    stability: 0.55
    similarity_boost: 0.80
    style: 0.18
    use_speaker_boost: true
    speed: 1.04

# ---------- Audio mix (dB) ----------
audio:
  voice_db: -1.5
  signature_duck_db: -15.0 # channel signature track under the voice (assets/audio/signature_bed.mp3)
  signature_open_db: -6.0  # signature track in intro / gaps / end
  music_db: -23.0          # fallback synth bed (only if the signature file is missing)
  music_open_db: -14.0     # bed level in gaps / intro
  sfx_db: -13.0
  intro_hit_db: -10.0

# ---------- Video ----------
video:
  width: 1080
  height: 1920
  fps: 30
  crf: 20
  preset: "veryfast"
  colors:
    bg: "#121212"
    panel: "#1B1B1F"
    red: "#FF2A2A"
    red_dark: "#B3141B"
    white: "#FFFFFF"
    grey: "#A9A9B2"
  images_per_story: [2, 4]
  seconds_per_image: 2.8     # "3-second rule": visual change every 2.5–3 s
  min_image_width: 640

# ---------- Upload ----------
youtube:
  enabled: true
  category_id: "25"          # News & Politics
  made_for_kids: false
  contains_synthetic_media: true   # AI voice → honest disclosure (protects channel trust)
  license: "youtube"
  post_first_comment: true   # API can post the comment; pinning must be done by hand (API limitation)
  custom_thumbnail: true     # frame-0 headline card uploaded as thumbnail (needs a phone-verified channel)
  upload_captions: true      # German subtitles from the voice timing → extra search text (ASR layer)
  use_playlists: true

facebook:
  enabled: true
  graph_version: "v23.0"

seo:
  # researched DACH search terms (SE Ranking DE 2025: "nachrichten" ~7.5 M/mo, "nachrichten aktuell" ~1 M/mo)
  base_tags: ["Eilblick", "Nachrichten", "Nachrichten aktuell", "Nachrichten heute", "News heute", "aktuelle Nachrichten",
              "Nachrichten Deutschland", "Schlagzeilen", "Eilmeldung", "Deutschland aktuell", "Kurznachrichten", "News kurz"]
  channel_keywords: ["Eilblick", "Nachrichten", "Nachrichten aktuell", "Nachrichten heute", "News heute", "aktuelle Nachrichten",
                     "Schlagzeilen", "Eilmeldung", "Nachrichten Deutschland", "Deutschland aktuell", "Politik aktuell",
                     "Wirtschaft aktuell", "Börse DAX", "Weltnachrichten", "Österreich Nachrichten", "Schweiz Nachrichten",
                     "Kurznachrichten", "News Shorts", "Tagesnachrichten", "DACH"]
  channel_description: >-
    Eilblick – Kompakt. Direkt. Auf den Punkt. Viermal täglich die wichtigsten Nachrichten aus Deutschland,
    Österreich, der Schweiz und Europa in unter 50 Sekunden: Politik, Wirtschaft, Welt und Technologie.
    Jede Meldung beruht auf Berichten von mindestens zwei etablierten Medien wie tagesschau, ZDFheute,
    Deutschlandfunk, ORF oder SRF – mit Quellen und Bildnachweisen in jeder Beschreibung.
    Neue Schlagzeilen täglich um 7:00, 12:00, 16:30 und 20:45 Uhr.
    Alle Hintergründe auf eilblick.de. Hinweis: Die Sprecherstimme ist KI-generiert.
  playlists:
    ALLE: {title: "Eilblick – Nachrichten heute in unter 50 Sekunden", description: "Alle Eilblick-Schlagzeilen: viermal täglich die wichtigsten Nachrichten aus Deutschland, Österreich, der Schweiz und der Welt."}
    POLITIK: {title: "Politik aktuell – Bundestag, Regierung & neue Gesetze", description: "Politische Nachrichten aus Deutschland, Österreich, der Schweiz und der EU – kompakt erklärt."}
    WIRTSCHAFT: {title: "Wirtschaft & Börse aktuell – DAX, Inflation, Energiepreise", description: "Wirtschaftsnachrichten: DAX, EZB, Inflation, Autoindustrie und Energiepreise – kompakt in Kurzform."}
    WELT: {title: "Weltnachrichten – NATO, EU & Geopolitik", description: "Internationale Nachrichten mit Bedeutung für Deutschland und Europa: NATO, EU, Welthandel und Zölle."}
    TECHNOLOGIE: {title: "Technologie & KI News – Digitales aus Deutschland", description: "Technik-Nachrichten: Künstliche Intelligenz, Cybersicherheit, Deutsche Bahn und digitale Infrastruktur."}
  base_hashtags_youtube: ["#eilblick", "#nachrichten", "#deutschland"]
  base_hashtags_facebook: ["#Eilblick", "#Nachrichten", "#Deutschland"]
