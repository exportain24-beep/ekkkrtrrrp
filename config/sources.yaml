  - {name: "Handelsblatt",      url: "https://www.handelsblatt.com/contentexport/feed/schlagzeilen", region: DE, weight: 0.9}
  - {name: "WirtschaftsWoche",  url: "https://www.wiwo.de/contentexport/feed/rss/schlagzeilen", region: DE, weight: 0.85}
