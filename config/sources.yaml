  - {name: "DER STANDARD",      url: "https://www.derstandard.at/rss",                       region: AT, weight: 0.85}

  # --- Switzerland ---
  - {name: "SRF News",          url: "https://www.srf.ch/news/bnf/rss/1646",                 region: CH, weight: 0.95}
  - {name: "NZZ",               url: "https://www.nzz.ch/recent.rss",                        region: CH, weight: 0.9}

  # --- Aggregator used for *trend signal* (how many outlets cover a story) ---
  - {name: "Google News DE",    url: "https://news.google.com/rss?hl=de&gl=DE&ceid=DE:de",   region: DE, weight: 0.6, aggregator: true}

# Google Trends (Germany) — boosts stories people are actively searching for right now.
trends_feed: "https://trends.google.com/trending/rss?geo=DE"

