  - {name: "tagesschau Inland", url: "https://www.tagesschau.de/inland/index~rss2.xml",      region: DE, weight: 1.0}
  - {name: "tagesschau Ausland",url: "https://www.tagesschau.de/ausland/index~rss2.xml",     region: INT, weight: 1.0}
  - {name: "tagesschau Wirtschaft", url: "https://www.tagesschau.de/wirtschaft/index~rss2.xml", region: DE, weight: 1.0}
  - {name: "ZDFheute",          url: "https://www.zdf.de/rss/zdf/nachrichten",               region: DE, weight: 1.0}
