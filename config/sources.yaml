# ============================================================
#  Trusted news sources (RSS / Atom).
#  region: DE / AT / CH / EU / INT   ·  weight: editorial trust (1.0 = top)
#  Dead feeds are skipped automatically; run `python -m eilblick check-feeds`
#  (or the "Check feeds" workflow) to see which ones answer.
# ============================================================

feeds:
