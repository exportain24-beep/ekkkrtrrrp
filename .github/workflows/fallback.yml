name: Eilblick 0 – API fallback (only if the Claude news desk did not run)

# Checks every 30 min for a slot starting in the next 10–75 min.
# Does nothing if the edition was already written or published. Only when the Claude
# scheduled task could not run (e.g. usage limit) it writes the edition with the
# Anthropic API key secret and builds it – one try.
on:
  schedule:
    # every 30 min – GitHub often starts scheduled runs late, so a dense schedule makes
    # sure one run lands in each slot's window (10–75 min before the slot). Runs that find
    # nothing to do finish in seconds.
    - cron: "7,37 * * * *"
  workflow_dispatch:
    inputs:
      slot:
        description: "force a slot (morgen / mittag / abend / nacht) – empty = automatic"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: eilblick-build
  cancel-in-progress: false

jobs:
  fallback:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      CLAUDE_API_KEY: ${{ secrets.CLAUDE_API_KEY }}
      ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
      YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
      YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
      YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
      FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
      FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
      FB_APP_ID: ${{ secrets.FB_APP_ID }}
      FB_APP_SECRET: ${{ secrets.FB_APP_SECRET }}
      BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -q -r requirements.txt
      - name: Decide + write edition via API if needed
        id: plan
        run: |
          git config user.name "eilblick-bot"
          git config user.email "eilblick-bot@users.noreply.github.com"
          ARGS=""
          if [ -n "${{ github.event.inputs.slot }}" ]; then ARGS="--slot ${{ github.event.inputs.slot }}"; fi
          python -m eilblick fallback $ARGS
          Q=$(git status --porcelain queue | grep -o 'queue/[^/]*' | head -1 || true)
          if [ -n "$Q" ] && [ -f "$Q/FALLBACK" ]; then
            git add -A queue && git commit -q -m "queue: fallback edition $Q (Anthropic API)"
            ok=0; for i in 1 2 3 4 5; do git pull --rebase -q && git push -q && ok=1 && break; sleep $((i*4)); done; [ $ok = 1 ]
            echo "queue=$Q" >> "$GITHUB_OUTPUT"
          fi
      - name: Install ffmpeg
        if: steps.plan.outputs.queue != ''
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null
      - name: Build & publish
        if: steps.plan.outputs.queue != ''
        run: python -m eilblick run --queue ${{ steps.plan.outputs.queue }}
      - name: Delete temporary news photos (always)
        if: always()
        run: rm -rf tmp_media
      - name: Save publish log
        if: always() && steps.plan.outputs.queue != ''
        run: |
          git add state/ ${{ steps.plan.outputs.queue }}/result.md 2>/dev/null || git add state/
          git commit -q -m "state: ${{ steps.plan.outputs.queue }} (fallback)" || exit 0
          ok=0; for i in 1 2 3 4 5; do git pull --rebase -q && git push -q && ok=1 && break; sleep $((i*4)); done; [ $ok = 1 ]
