name: Check setup (keys + news feeds)

# Verifies every key and the news feeds; results are saved to state/check_*.md (no secrets are written).
on:
  workflow_dispatch:
    inputs:
      buffer_test:
        description: "Send a test video to Buffer as DRAFT (TikTok + X)"
        type: boolean
        default: false
      buffer_delete:
        description: "Buffer post ids to delete (space separated)"
        required: false
        default: ""
      channel_seo:
        description: "Also apply channel SEO (description, keywords, playlists, page about)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: eilblick-repo-write
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      CLAUDE_API_KEY: ${{ secrets.CLAUDE_API_KEY }}
      ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
      YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
      YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
      YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
      FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
      FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
      FB_APP_ID: ${{ secrets.FB_APP_ID }}
      FB_APP_SECRET: ${{ secrets.FB_APP_SECRET }}
      BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q -r requirements.txt
      - name: API keys
        run: python -m eilblick check-tokens
        continue-on-error: true
      - name: News feeds
        run: python -m eilblick check-feeds
        continue-on-error: true
      - name: Recover missing publish records
        run: python -m eilblick recover
        continue-on-error: true
      - name: Buffer draft test
        if: github.event.inputs.buffer_test == 'true'
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null
          python -m eilblick buffer-test
        continue-on-error: true
      - name: Buffer delete posts
        if: github.event.inputs.buffer_delete != ''
        run: python -m eilblick buffer-delete ${{ github.event.inputs.buffer_delete }}
        continue-on-error: true
      - name: Channel SEO
        if: github.event.inputs.channel_seo == 'true'
        run: python -m eilblick channel-seo
        continue-on-error: true
      - name: Save reports
        if: always()
        run: |
          git config user.name "eilblick-bot"
          git config user.email "eilblick-bot@users.noreply.github.com"
          git add state/
          git commit -q -m "state: setup check" || exit 0
          git pull --rebase -q && git push -q
