name: Eilblick 2 – Build & publish Short

# Started by the Claude scheduled task after it wrote queue/<date>_<slot>/plan.json.
# Collects the news photos (temporary), voice, render, uploads scheduled to YouTube + Facebook,
# adds thumbnail, German captions, playlists, then deletes the photos.
on:
  workflow_dispatch:
    inputs:
      queue:
        description: "queue folder, e.g. queue/2026-11-02_mittag"
        required: true
      upload:
        description: "Upload to YouTube + Facebook?"
        type: boolean
        default: true
      force:
        description: "Rebuild even if this slot was already published"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: eilblick-build
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
      YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
      YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
      YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
      FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
      FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
      FB_APP_ID: ${{ secrets.FB_APP_ID }}
      FB_APP_SECRET: ${{ secrets.FB_APP_SECRET }}
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install ffmpeg + Python packages
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null
          pip install -q -r requirements.txt
      - name: Build & publish
        run: |
          ARGS="run --queue ${{ github.event.inputs.queue }}"
          if [ "${{ github.event.inputs.upload }}" = "false" ]; then ARGS="$ARGS --no-upload"; fi
          if [ "${{ github.event.inputs.force }}" = "true" ]; then ARGS="$ARGS --force"; fi
          python -m eilblick $ARGS
      - name: Delete temporary news photos (always)
        if: always()
        run: rm -rf tmp_media
      - name: Save publish log + result
        if: always()
        run: |
          git config user.name "eilblick-bot"
          git config user.email "eilblick-bot@users.noreply.github.com"
          git add state/ ${{ github.event.inputs.queue }}/result.md 2>/dev/null || git add state/
          git commit -q -m "state: ${{ github.event.inputs.queue }}" || exit 0
          for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 5; done
      - name: Keep video for review (3 days)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eilblick-${{ github.run_id }}
          path: |
            out/*.mp4
            out/*.json
            out/*.srt
            out/preview/*.jpg
          retention-days: 3
          if-no-files-found: ignore
